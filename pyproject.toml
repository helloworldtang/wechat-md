[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wechat-md"
version = "0.1.0"
description = "Markdown → 微信公众号友好 HTML（移植自 OpenClaw 实战后处理）"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "ExoMind Contributors" }]
keywords = ["wechat", "markdown", "html", "gongzhonghao", "mp"]
dependencies = ["markdown2>=2.4"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/wechat_md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
