name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write  # Required for Trusted Publishing

jobs:
  quality-gate:
    name: Quality gate (ruff / mypy strict / pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package and tools
        run: pip install -e ".[dev]" ruff mypy

      - name: Ruff
        run: ruff check .

      - name: Mypy strict
        run: mypy --strict src

      - name: Pytest
        run: pytest -q

  pypi-publish:
    name: Upload release to PyPI
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
